# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      gradle-test-patches:
        patterns: ["junit:junit", "org.opentest4j:opentest4j"]
        update-types: ["patch"]
      gradle-patches:
        patterns: ["*"]
        update-types: ["patch"]
      gradle-minor:
        patterns: ["*"]
        update-types: ["minor"]
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-patches:
        patterns: ["*"]
        exclude-patterns: ["dependabot/fetch-metadata"]
        update-types: ["patch"]
      actions-minor:
        patterns: ["*"]
        update-types: ["minor"]
