name: Publish to JetBrains Marketplace
on:
  release:
    types: [prereleased, released]
  workflow_call:
    secrets:
      PUBLISH_TOKEN:
        required: false
      CERTIFICATE_CHAIN:
        required: false
      PRIVATE_KEY:
        required: false
      PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MARKETPLACE_CONFIGURED: ${{ secrets.PUBLISH_TOKEN != '' }}
    steps:
      - name: Report missing Marketplace token
        if: env.MARKETPLACE_CONFIGURED == 'false'
        run: echo '::notice::Set the PUBLISH_TOKEN secret to enable Marketplace publishing.'

      - name: Maximize Build Space
        if: env.MARKETPLACE_CONFIGURED == 'true'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: env.MARKETPLACE_CONFIGURED == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: env.MARKETPLACE_CONFIGURED == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        if: env.MARKETPLACE_CONFIGURED == 'true'
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Publish Plugin
        if: env.MARKETPLACE_CONFIGURED == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -x patchChangelog
