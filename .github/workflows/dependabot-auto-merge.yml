name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.repository == 'yelog/ideavim-cmdfloat' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.commits == 1 &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98

      - name: Enable auto-merge for eligible patches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          if ! jq -e '
            type == "array" and length > 0 and all(.[];
              .updateType == "version-update:semver-patch" and
              (
                (.packageEcosystem == "github_actions" and
                 (.dependencyName | type == "string" and length > 0 and
                  ascii_downcase != "dependabot/fetch-metadata"))
                or
                (.packageEcosystem == "gradle" and
                 (.dependencyName == "junit:junit" or .dependencyName == "org.opentest4j:opentest4j"))
              )
            )
          ' <<< "$UPDATED_DEPENDENCIES" >/dev/null; then
            echo "This pull request requires manual review."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$PR_HEAD_SHA"
